name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebook JSON and Python cells
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path("notebooks/transformer_lgbm_stacking.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))
          code_cells = [c for c in nb["cells"] if c["cell_type"] == "code"]
          for cell in code_cells:
              ast.parse("".join(cell["source"]))
          print(f"notebook ok: {len(code_cells)} code cells")
          PY

      - name: Check scripts compile
        run: python -m compileall -q data
